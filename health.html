<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Health">
<title>Water Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #050506;
  --bg-card: rgba(255, 255, 255, 0.04);
  --bg-secondary: rgba(255, 255, 255, 0.035);
  --bg-input: rgba(0, 0, 0, 0.28);
  --bg-input-focus: rgba(0, 0, 0, 0.36);
  --bg-dropdown: rgba(15, 15, 18, 0.96);

  --border: rgba(255, 255, 255, 0.06);
  --border-soft: rgba(255, 255, 255, 0.04);
  --border-strong: rgba(255, 255, 255, 0.12);

  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --text-quaternary: #4D4B47;

  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text-secondary);
  font-family: var(--font);
  font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body { min-height: 100vh; position: relative; overflow-x: hidden; }

body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(60% 50% at 82% 14%, rgba(224, 118, 88, 0.16) 0%, transparent 60%),
    radial-gradient(50% 40% at 18% 90%, rgba(180, 180, 200, 0.06) 0%, transparent 60%);
  filter: blur(40px);
  pointer-events: none; z-index: 0;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none; z-index: 1;
}
@keyframes drift { 0% { transform: translate(0, 0); } 100% { transform: translate(-2%, 2%); } }

main {
  position: relative; z-index: 2;
  max-width: 720px; margin: 0 auto;
  padding: 56px 20px 80px;
  padding-top: max(56px, env(safe-area-inset-top, 56px));
}

.section-title {
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary);
  margin: 0 4px 14px;
  display: flex; align-items: center; gap: 12px;
}
.section-title::before { content: '≡'; font-size: 14px; opacity: 0.5; }

.macro-card {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 22px 22px 18px;
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  margin-bottom: 40px;
}
.macro-cals { text-align: center; margin-bottom: 20px; }
.macro-cals-num {
  font-size: 34px; font-weight: 700;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.macro-cals-target { font-size: 16px; color: var(--text-tertiary); font-weight: 600; }
.macro-cals-label {
  font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-tertiary);
  margin-top: 4px;
}

.macro-bars { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
.macro-bar-head {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12px; margin-bottom: 6px;
}
.macro-bar-name {
  font-weight: 600; color: var(--text-primary);
  display: inline-flex; align-items: center; gap: 6px;
}
.macro-bar-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.macro-bar-nums {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-tertiary); font-variant-numeric: tabular-nums;
}
.macro-bar-track {
  height: 8px;
  background: rgba(255,255,255,0.06);
  border-radius: 999px;
  overflow: hidden;
}
.macro-bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }

.macro-protein .macro-bar-dot, .macro-protein .macro-bar-fill { background: #7DD3FC; }
.macro-carbs   .macro-bar-dot, .macro-carbs   .macro-bar-fill { background: var(--warning, #F2C063); }
.macro-fat     .macro-bar-dot, .macro-fat     .macro-bar-fill { background: #C084FC; }

.macro-list { list-style: none; margin: 0 0 4px; padding: 0; }
.macro-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 4px;
  border-bottom: 1px solid var(--border-soft);
  font-size: 13px;
}
.macro-row:last-child { border-bottom: none; }
.macro-row-name { flex: 1; min-width: 0; color: var(--text-primary); }
.macro-row-macros {
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-tertiary); white-space: nowrap;
}
.macro-row-del {
  border: 0; background: transparent;
  color: var(--text-tertiary);
  font-size: 16px; cursor: pointer;
  opacity: 0.6; padding: 0 2px;
  transition: opacity 0.15s, color 0.15s;
}
.macro-row-del:hover { color: #FF6B6B; opacity: 1; }
.macro-empty {
  font-size: 12px; font-style: italic;
  color: var(--text-tertiary);
  padding: 10px 0; text-align: center;
}

.macro-add-row {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--border-soft);
}
.macro-input {
  padding: 9px 11px;
  border-radius: 10px;
  border: 1px solid var(--border-strong);
  background: var(--bg-input);
  color: var(--text-primary);
  font-family: inherit; font-size: 16px;
  outline: none;
  transition: border-color 0.18s, background 0.18s;
}
.macro-input::placeholder { color: var(--text-tertiary); }
.macro-input:focus { border-color: rgba(255,255,255,0.40); background: var(--bg-input-focus); }
.macro-input-name { flex: 1.4; min-width: 110px; }
.macro-input-num { width: 68px; }
.macro-input-cals { width: 90px; }
.macro-add-btn {
  padding: 9px 16px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.85);
  background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%);
  color: #0A0A0B;
  font-weight: 700; font-size: 13px;
  cursor: pointer; font-family: inherit;
  transition: transform 0.12s, background 0.18s;
}
.macro-add-btn:hover { background: linear-gradient(180deg, #FFFFFF 0%, #F2F0EA 100%); transform: translateY(-1px); }
.macro-add-btn:active { transform: translateY(0); }

.macro-targets-toggle {
  width: 100%; margin-top: 10px;
  padding: 8px;
  border: 1px dashed var(--border-strong);
  border-radius: 10px;
  background: transparent;
  color: var(--text-tertiary);
  font-family: inherit;
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.macro-targets-toggle:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.22); }
.macro-targets-row {
  display: none; flex-wrap: wrap; gap: 6px;
  margin-top: 10px;
}
.macro-targets-row.show { display: flex; }
.macro-targets-label {
  flex-basis: 100%;
  font-size: 11px; color: var(--text-tertiary);
}
.macro-pct-preview {
  flex-basis: 100%;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 2px;
}
.macro-pct-preview.warn { color: var(--warning, #F2C063); }

.water-iframe {
  display: block;
  width: 100%;
  height: 880px; /* fallback until the resize script measures real content */
  border: 0;
  background: transparent;
  border-radius: 16px;
  color-scheme: dark;
}

.attribution {
  text-align: center; margin-top: 28px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-quaternary);
}

@media (max-width: 600px) {
  main { padding: 40px 16px 60px; }
}

::selection { background: rgba(224, 118, 88, 0.3); color: var(--text-primary); }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.15); }
</style>
</head>
<body>

<main>
  <section id="macros">
    <div class="section-title">Macros</div>
    <div class="macro-card">
      <div class="macro-cals">
        <div class="macro-cals-num" id="macroCalsNum">0 <span class="macro-cals-target">/ 0 kcal</span></div>
        <div class="macro-cals-label">Today</div>
      </div>

      <div class="macro-bars">
        <div class="macro-bar-row macro-protein">
          <div class="macro-bar-head">
            <span class="macro-bar-name"><span class="macro-bar-dot"></span>Protein</span>
            <span class="macro-bar-nums" id="macroProteinNums">0 / 0 g</span>
          </div>
          <div class="macro-bar-track"><div class="macro-bar-fill" id="macroProteinFill" style="width:0%"></div></div>
        </div>
        <div class="macro-bar-row macro-carbs">
          <div class="macro-bar-head">
            <span class="macro-bar-name"><span class="macro-bar-dot"></span>Carbs</span>
            <span class="macro-bar-nums" id="macroCarbsNums">0 / 0 g</span>
          </div>
          <div class="macro-bar-track"><div class="macro-bar-fill" id="macroCarbsFill" style="width:0%"></div></div>
        </div>
        <div class="macro-bar-row macro-fat">
          <div class="macro-bar-head">
            <span class="macro-bar-name"><span class="macro-bar-dot"></span>Fat</span>
            <span class="macro-bar-nums" id="macroFatNums">0 / 0 g</span>
          </div>
          <div class="macro-bar-track"><div class="macro-bar-fill" id="macroFatFill" style="width:0%"></div></div>
        </div>
      </div>

      <ul class="macro-list" id="macroList"></ul>
      <div class="macro-empty" id="macroEmpty">No food logged yet today</div>

      <div class="macro-add-row">
        <input type="text" id="macroName" class="macro-input macro-input-name" placeholder="Food (optional)" autocomplete="off">
        <input type="number" id="macroProtein" class="macro-input macro-input-num" placeholder="P g" min="0" step="1" inputmode="decimal">
        <input type="number" id="macroCarbs" class="macro-input macro-input-num" placeholder="C g" min="0" step="1" inputmode="decimal">
        <input type="number" id="macroFat" class="macro-input macro-input-num" placeholder="F g" min="0" step="1" inputmode="decimal">
        <button type="button" id="macroAddBtn" class="macro-add-btn">+ Add</button>
      </div>

      <button type="button" id="macroTargetsToggle" class="macro-targets-toggle">Edit daily targets</button>
      <div class="macro-targets-row" id="macroTargetsRow">
        <span class="macro-targets-label">Daily calorie intake</span>
        <input type="number" id="macroTargetCalories" class="macro-input macro-input-num macro-input-cals" placeholder="kcal" min="0" step="10" inputmode="decimal">
        <span class="macro-targets-label">Macro split — % of calories</span>
        <input type="number" id="macroTargetProteinPct" class="macro-input macro-input-num" placeholder="P %" min="0" max="100" step="1" inputmode="decimal">
        <input type="number" id="macroTargetCarbsPct" class="macro-input macro-input-num" placeholder="C %" min="0" max="100" step="1" inputmode="decimal">
        <input type="number" id="macroTargetFatPct" class="macro-input macro-input-num" placeholder="F %" min="0" max="100" step="1" inputmode="decimal">
        <span class="macro-pct-preview" id="macroPctPreview">100% · 0g P · 0g C · 0g F</span>
        <button type="button" id="macroTargetsSaveBtn" class="macro-add-btn">Save</button>
      </div>
    </div>
  </section>

  <section id="water" class="water-embed">
    <div class="section-title">Water Tracker</div>
    <iframe src="po-water.html" class="water-iframe" loading="lazy" title="Water Tracker" scrolling="no"></iframe>
  </section>

  <div class="attribution">// editable template · all data stays in your browser</div>
</main>

<script>
(function () {
  'use strict';
  const MACRO_TARGETS_KEY = 'macros:targets';
  const DEFAULT_TARGETS = { calories: 2000, proteinPct: 30, carbsPct: 40, fatPct: 30 };

  // 4 kcal/g for protein and carbs, 9 kcal/g for fat.
  function gramsFromPct(calories, pct, kcalPerGram) {
    return (Number(calories) || 0) * (Number(pct) || 0) / 100 / kcalPerGram;
  }
  function targetGramsFor(targets, calories) {
    return {
      protein: gramsFromPct(calories, targets.proteinPct, 4),
      carbs: gramsFromPct(calories, targets.carbsPct, 4),
      fat: gramsFromPct(calories, targets.fatPct, 9)
    };
  }

  function pad2(n) { return String(n).padStart(2, '0'); }
  function todayKey() {
    const d = new Date();
    return 'macros:' + d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function storeGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function storeSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  function getTargets() {
    const t = storeGet(MACRO_TARGETS_KEY);
    return (t && typeof t === 'object') ? Object.assign({}, DEFAULT_TARGETS, t) : Object.assign({}, DEFAULT_TARGETS);
  }
  function setTargets(t) { storeSet(MACRO_TARGETS_KEY, t); }

  function getEntries() {
    const list = storeGet(todayKey());
    return Array.isArray(list) ? list : [];
  }
  function setEntries(list) { storeSet(todayKey(), list); }

  function calcCalories(p, c, f) {
    return Math.round((Number(p) || 0) * 4 + (Number(c) || 0) * 4 + (Number(f) || 0) * 9);
  }

  function renderMacros() {
    const entries = getEntries();
    const targets = getTargets();
    const totals = entries.reduce((acc, e) => {
      acc.protein += Number(e.protein) || 0;
      acc.carbs += Number(e.carbs) || 0;
      acc.fat += Number(e.fat) || 0;
      return acc;
    }, { protein: 0, carbs: 0, fat: 0 });
    const totalCals = calcCalories(totals.protein, totals.carbs, totals.fat);
    const targetCals = Number(targets.calories) || DEFAULT_TARGETS.calories;
    const targetGrams = targetGramsFor(targets, targetCals);

    const calsNumEl = document.getElementById('macroCalsNum');
    if (calsNumEl) {
      calsNumEl.innerHTML = Math.round(totalCals) + ' <span class="macro-cals-target">/ ' + Math.round(targetCals) + ' kcal</span>';
    }

    function setBar(key, label) {
      const cur = Math.round(totals[key]);
      const tgt = Math.max(1, Math.round(targetGrams[key]));
      const numsEl = document.getElementById('macro' + label + 'Nums');
      const fillEl = document.getElementById('macro' + label + 'Fill');
      if (numsEl) numsEl.textContent = cur + ' / ' + tgt + ' g';
      if (fillEl) fillEl.style.width = Math.min(100, (cur / tgt) * 100) + '%';
    }
    setBar('protein', 'Protein');
    setBar('carbs', 'Carbs');
    setBar('fat', 'Fat');

    const listEl = document.getElementById('macroList');
    const emptyEl = document.getElementById('macroEmpty');
    if (listEl && emptyEl) {
      listEl.innerHTML = '';
      emptyEl.style.display = entries.length === 0 ? 'block' : 'none';
      entries.forEach((e, idx) => {
        const li = document.createElement('li');
        li.className = 'macro-row';
        const name = document.createElement('span');
        name.className = 'macro-row-name';
        name.textContent = e.name || 'Food';
        const macros = document.createElement('span');
        macros.className = 'macro-row-macros';
        macros.textContent = Math.round(e.protein || 0) + 'P · ' + Math.round(e.carbs || 0) + 'C · ' + Math.round(e.fat || 0) + 'F · ' + calcCalories(e.protein, e.carbs, e.fat) + ' kcal';
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'macro-row-del';
        del.setAttribute('aria-label', 'Delete entry');
        del.textContent = '×';
        del.addEventListener('click', () => {
          const list = getEntries();
          list.splice(idx, 1);
          setEntries(list);
          renderMacros();
        });
        li.appendChild(name); li.appendChild(macros); li.appendChild(del);
        listEl.appendChild(li);
      });
    }

    const tCals = document.getElementById('macroTargetCalories');
    const tP = document.getElementById('macroTargetProteinPct');
    const tC = document.getElementById('macroTargetCarbsPct');
    const tF = document.getElementById('macroTargetFatPct');
    if (tCals && document.activeElement !== tCals) tCals.value = targetCals;
    if (tP && document.activeElement !== tP) tP.value = targets.proteinPct;
    if (tC && document.activeElement !== tC) tC.value = targets.carbsPct;
    if (tF && document.activeElement !== tF) tF.value = targets.fatPct;
    updateMacroPctPreview();
  }

  // Live preview of what the %/calorie split works out to in grams,
  // while the user is still editing (before Save is pressed).
  function updateMacroPctPreview() {
    const previewEl = document.getElementById('macroPctPreview');
    if (!previewEl) return;
    const calsEl = document.getElementById('macroTargetCalories');
    const pEl = document.getElementById('macroTargetProteinPct');
    const cEl = document.getElementById('macroTargetCarbsPct');
    const fEl = document.getElementById('macroTargetFatPct');
    if (!calsEl || !pEl || !cEl || !fEl) return;
    const cals = parseFloat(calsEl.value) || 0;
    const pPct = parseFloat(pEl.value) || 0;
    const cPct = parseFloat(cEl.value) || 0;
    const fPct = parseFloat(fEl.value) || 0;
    const total = pPct + cPct + fPct;
    const grams = targetGramsFor({ proteinPct: pPct, carbsPct: cPct, fatPct: fPct }, cals);
    previewEl.textContent = Math.round(total) + '% · ' + Math.round(grams.protein) + 'g P · ' + Math.round(grams.carbs) + 'g C · ' + Math.round(grams.fat) + 'g F';
    previewEl.classList.toggle('warn', Math.round(total) !== 100);
  }

  function addMacroEntry() {
    const nameEl = document.getElementById('macroName');
    const pEl = document.getElementById('macroProtein');
    const cEl = document.getElementById('macroCarbs');
    const fEl = document.getElementById('macroFat');
    if (!nameEl || !pEl || !cEl || !fEl) return;
    const p = parseFloat(pEl.value) || 0;
    const c = parseFloat(cEl.value) || 0;
    const f = parseFloat(fEl.value) || 0;
    if (p <= 0 && c <= 0 && f <= 0) return;
    const list = getEntries();
    list.push({
      id: 'm' + Date.now() + '_' + Math.floor(Math.random() * 999),
      name: nameEl.value.trim(), protein: p, carbs: c, fat: f, ts: Date.now()
    });
    setEntries(list);
    nameEl.value = ''; pEl.value = ''; cEl.value = ''; fEl.value = '';
    renderMacros();
  }

  document.addEventListener('DOMContentLoaded', function () {
    const addBtn = document.getElementById('macroAddBtn');
    if (addBtn) addBtn.addEventListener('click', addMacroEntry);
    ['macroName', 'macroProtein', 'macroCarbs', 'macroFat'].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addMacroEntry(); } });
    });

    const targetsToggle = document.getElementById('macroTargetsToggle');
    const targetsRow = document.getElementById('macroTargetsRow');
    if (targetsToggle && targetsRow) {
      targetsToggle.addEventListener('click', () => targetsRow.classList.toggle('show'));
    }
    ['macroTargetCalories', 'macroTargetProteinPct', 'macroTargetCarbsPct', 'macroTargetFatPct'].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', updateMacroPctPreview);
    });
    const targetsSaveBtn = document.getElementById('macroTargetsSaveBtn');
    if (targetsSaveBtn) {
      targetsSaveBtn.addEventListener('click', () => {
        const cals = parseFloat(document.getElementById('macroTargetCalories').value) || DEFAULT_TARGETS.calories;
        const p = parseFloat(document.getElementById('macroTargetProteinPct').value) || DEFAULT_TARGETS.proteinPct;
        const c = parseFloat(document.getElementById('macroTargetCarbsPct').value) || DEFAULT_TARGETS.carbsPct;
        const f = parseFloat(document.getElementById('macroTargetFatPct').value) || DEFAULT_TARGETS.fatPct;
        setTargets({ calories: cals, proteinPct: p, carbsPct: c, fatPct: f });
        if (targetsRow) targetsRow.classList.remove('show');
        renderMacros();
      });
    }

    window.addEventListener('storage', renderMacros);
    renderMacros();
  });
})();
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (typeof initCloudSync !== 'function') return;
  initCloudSync({
    appKey: 'health',
    syncedKeys: ['po_water_v1', 'macros:targets'],
    syncedPrefixes: ['macros:'],
    onApplied: function () { window.dispatchEvent(new Event('storage')); }
  });
});
</script>
<script>
// The water tracker is embedded same-origin, so instead of letting the
// iframe scroll internally (a separate scroll region stacked inside the
// page — awkward on touch), measure its real content height and grow
// the iframe to match. The outer page then does all the scrolling.
document.addEventListener('DOMContentLoaded', function () {
  const iframe = document.querySelector('.water-iframe');
  if (!iframe) return;

  function resize() {
    try {
      const doc = iframe.contentDocument;
      if (!doc || !doc.documentElement) return;
      const h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
      if (h) iframe.style.height = h + 'px';
    } catch (e) {}
  }

  iframe.addEventListener('load', function () {
    resize();
    try {
      const doc = iframe.contentDocument;
      if (doc && window.ResizeObserver) {
        new ResizeObserver(resize).observe(doc.documentElement);
      }
    } catch (e) {}
  });
});
</script>

</body>
</html>
